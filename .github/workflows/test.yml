name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Set up Python
        run: uv venv --python 3.12
      - name: Install dependencies
        run: uv sync --extra agent
      - name: Run unit tests
        run: |
          uv run pytest tests/ agent/tests/ tools/tests/ commit0/harness/tests/ \
            --ignore=agent/tests/live_summarizer_test.py \
            -x -q 2>&1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check for committed AWS ARNs
        run: |
          if git grep -nE 'arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:' -- ':!*.example'; then
            echo "ERROR: Real AWS ARNs found in tracked files. Replace with env var references." >&2
            exit 1
          fi
          echo "No committed ARNs found."
