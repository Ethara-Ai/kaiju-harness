[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit0"
version = "0.1.8"
description = "A development and evaluation framework for using language models to generate libraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.6.4",
    "pre-commit>=3.8.0",
    "typer>=0.12.0",
    "docker>=7.1.0",
    "fastcore>=1.7.8",
    "ghapi>=1.0.6",
    "gitpython>=3.1.43",
    "pytest>=8.3.3",
    "datasets>=3.0.1",
    "modal>=0.66.26",
    "strenum>=0.4.15",
    "e2b-code-interpreter>=1.0.4",
    "python-dotenv>=1.0.1",
    "boto3>=1.34.0",
    "defusedxml>=0.7.1",
    "playwright>=1.40.0",
    "PyMuPDF>=1.24.5",
    "PyPDF2>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "harbor>=0.13.1",
    "google-cloud-aiplatform>=1.156.0",
    "google-genai>=2.8.0",
    "google-auth>=2.53.0",
    # Tree-sitter parsers for the C++ stubber fallback path (tools/stub_cpp.py).
    # Direct dep because we cannot rely on aider-chat transitively pulling these
    # in forever; the C++ prepare pipeline WILL corrupt files if the fallback is
    # missing when cppstubber (Clang LibTooling binary) is unavailable.
    "tree-sitter>=0.23.0,<1.0",
    "tree-sitter-language-pack>=0.13.0,<1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
commit0 = "commit0.__main__:main"
commit0-java = "commit0.cli_java:main"
agent = "agent.__main__:main"
kaiju-stage-runner = "agent.cli_stage_runner:app"

[tool.hatch.build.targets.wheel]
# NOTE: no "kaiju_harbor" — that package dir does not exist (0 tracked files, no
# imports). Editable installs tolerate a missing declared package, but a
# non-editable wheel build would fail on it. Keep this list to dirs that exist.
packages = ["commit0", "agent", "kaiju"]

[project.optional-dependencies]
agent = [
    "import-deps>=0.3.0",
    "PyMuPDF>=1.24.5",
    "aider-chat",
]
scrape = [
    "playwright>=1.40.0",
    "PyMuPDF>=1.24.5",
    "PyPDF2>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://commit-0.github.io/"
Repository = "https://github.com/commit-0/commit0"
Issues = "https://github.com/commit-0/commit0/issues"

[tool.pyright]
include = ["**/commit0", "**/agent", "**/tools"]
ignore = ["**/docs", "**/logs"]
venvPath = "."
venv = ".venv"
# Pyright strictness ratchet: add modules to `strict` as they reach 0 strict-mode errors.
# Goal: incrementally expand coverage; never remove a module once added.
strict = ["commit0/__init__.py"]
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeArgument = "none"
reportMissingTypeStubs = "none"
reportUnusedExpression = "none"
reportUnknownLambdaType = "none"
reportIncompatibleMethodOverride = "none"
reportPrivateUsage = "none"
reportMissingParameterType = "error"


[tool.ruff]
exclude = [
    ".git",
    "**/.venv/**",
    "__pycache__",
    "**/docs/**/*",
    "**/logs/**/*",
]

lint.ignore = [
    "ANN101",
    "ANN401",
    "N801",
    "E203",
    "E266",
    "E501",
    "E741",
    "N803",
    "N802",
    "N806",
    "D400",
    "D401",
    "D105",
    "D415",
    "D402",
    "D205",
    "D100",
    "D101",
    "D107",
    "D203",
    "D213",
    "ANN204",
    "ANN102",
    "ANN001",
    "ANN201",
    "D102",
    "D103",
    "D104",
    "D301",
    "D417",
    "ANN002",
    "ANN003",
    "ANN202",
    "ANN205",
    "E402",
    "N814",
    "N817",
]
lint.select = ["D", "E", "F", "N", "ANN"]
lint.extend-select = ["F811"]
lint.fixable = [
    "A",
    "B",
    "C",
    "D",
    "E",
    "F",
